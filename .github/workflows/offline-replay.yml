name: Historical offline replay

on: [push, pull_request]

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test the original molecular core
        run: python research/02_tests/test_baseline_core.py
      - name: Check the core code index still matches the source
        run: python scripts/check_code_index.py
      - name: Recompute every table cell from raw responses
        run: python scripts/replay_table.py
